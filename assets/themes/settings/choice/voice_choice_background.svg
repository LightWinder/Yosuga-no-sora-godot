<svg xmlns="http://www.w3.org/2000/svg" width="230" height="78" viewBox="0 0 230 78">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fdff" stop-opacity="0.58"/>
      <stop offset="0.55" stop-color="#d9eef7" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#b9ddea" stop-opacity="0.38"/>
    </linearGradient>
  </defs>

  <!-- Soft cyan lower keyline, matching the source button's lifted edge. -->
  <rect x="3" y="11" width="224" height="60" rx="15"
        fill="#77aec4" fill-opacity="0.16"
        stroke="#69a8c1" stroke-opacity="0.48" stroke-width="4"/>

  <!-- Bright outer shell and translucent glass fill. -->
  <rect x="3" y="7" width="224" height="60" rx="15"
        fill="url(#fill)"
        stroke="#f5fdff" stroke-opacity="0.92" stroke-width="3"/>

  <!-- Recessed inner cyan keyline. -->
  <rect x="8" y="12" width="214" height="50" rx="11"
        fill="none"
        stroke="#83bcd3" stroke-opacity="0.72" stroke-width="2"/>

  <!-- Subtle top highlight keeps the border readable over pale panels. -->
  <path d="M19 10.5h192" fill="none"
        stroke="#ffffff" stroke-opacity="0.58" stroke-width="1.5"
        stroke-linecap="round"/>
</svg>
